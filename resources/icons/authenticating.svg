<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 认证中（琥珀色）
       针对托盘 16x16 显示重做：
       - 纯色填充，无渐变
       - 去掉 CSS @keyframes 脉冲/旋转动画：QIcon 是静态加载 SVG，
         CSS 动画根本不会播放，反而增加解析风险
       - 改用「三个白点」表示进行中，小尺寸下比细圆环更易辨认 -->
  <circle cx="32" cy="32" r="26" fill="#f59e0b"/>
  <circle cx="19" cy="32" r="4.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
  <circle cx="45" cy="32" r="4.5" fill="#ffffff"/>
</svg>
